name: Deploy Portfolio to EC2 VPS

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: SSH into EC2 and Deploy
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.VPS_HOST }}
        username: ${{ secrets.VPS_USERNAME }}
        key: ${{ secrets.VPS_SSH_KEY }}
        script: |
          cd ~/portfolio || (git clone https://github.com/Jaspreet-Bhatia-SI/portfolio.git ~/portfolio && cd ~/portfolio)
          git checkout main
          git reset --hard HEAD
          git pull origin main
          docker-compose up -d --build
